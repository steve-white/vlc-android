name: Sync upstream and build

# Mirrors videolan/vlc-android master into this fork's master, rebases the
# fork's patch branch on top of it, builds a debug APK and, only if the build
# succeeds, force-pushes the rebased branch.
#
# Scheduled workflows run from the fork's DEFAULT branch, so this file must
# live on CUSTOM_BRANCH and CUSTOM_BRANCH must be the default branch
# (Settings -> Branches). `master` stays a pure mirror of upstream.
#
# Secrets:
#   SYNC_TOKEN  (recommended) PAT with `repo` + `workflow` scopes. Pushing a
#               rebased branch that contains .github/workflows changes is
#               refused for the default GITHUB_TOKEN.
#
# Build type: debug | release | signedRelease. Manual runs pick it in the
# dispatch form; scheduled runs use the repository variable BUILD_TYPE
# (Settings -> Secrets and variables -> Actions -> Variables), defaulting to
# signedRelease. `release` is unsigned and can't be installed, so prefer
# signedRelease, which needs these secrets:
#   KEYSTORE_BASE64    base64 of the keystore file (`base64 -w0 my.keystore`)
#   KEYSTORE_PASSWORD  store and key password (the app uses one for both)
#   KEYSTORE_ALIAS     optional, key alias, defaults to `vlc`

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even if there is nothing new upstream
        type: boolean
        default: false
      build_type:
        description: Build type (default = repository variable BUILD_TYPE, else signedRelease)
        type: choice
        options:
          - default
          - debug
          - release
          - signedRelease
        default: default

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_URL: https://github.com/videolan/vlc-android.git
  UPSTREAM_BRANCH: master
  CUSTOM_BRANCH: wildcard-search
  BUILD_TYPE: ${{ inputs.build_type != 'default' && inputs.build_type || vars.BUILD_TYPE || 'signedRelease' }}

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUSTOM_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      # Fail before touching any branch if the build can't work
      - name: Check build config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          case "$BUILD_TYPE" in
            debug|release) ;;
            signedRelease)
              if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
                echo "::error::signedRelease needs the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (or set the BUILD_TYPE variable to debug/release)"
                exit 1
              fi ;;
            *)
              echo "::error::Unknown BUILD_TYPE '$BUILD_TYPE' (use debug, release or signedRelease)"
              exit 1 ;;
          esac
          echo "Building: $BUILD_TYPE"

      - name: Configure git
        run: |
          # --global: get-vlc.sh clones VLC into a nested repo and runs `git am`
          # there, which needs an identity too
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config rerere.enabled true
          git config rerere.autoupdate true

      # Remembers conflict resolutions so a repeat conflict resolves itself
      - uses: actions/cache@v4
        with:
          path: .git/rr-cache
          key: rerere-${{ github.run_id }}
          restore-keys: rerere-

      - name: Fetch upstream and update mirror branch
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          # Fast-forward only: fails loudly if the mirror ever diverges
          git push origin "refs/remotes/upstream/$UPSTREAM_BRANCH:refs/heads/$UPSTREAM_BRANCH"

      - name: Rebase patch branch onto upstream
        id: rebase
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          OLD_SHA=$(git rev-parse HEAD)
          BEHIND=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" = 0 ] && [ "$FORCE_BUILD" != "true" ]; then
            echo "Nothing new upstream, skipping."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          if ! git rebase "upstream/$UPSTREAM_BRANCH"; then
            echo "::error::Rebase of $CUSTOM_BRANCH onto upstream/$UPSTREAM_BRANCH hit conflicts in: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git rebase --abort
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.rebase.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        if: steps.rebase.outputs.needed == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'buildsystem/compile.sh') }}
          restore-keys: gradle-${{ runner.os }}-

      # App-only build, same as upstream's `continuous-app-build` job: libvlc
      # and the medialibrary come from published artifacts, so no native build.
      - name: Build ${{ env.BUILD_TYPE }} APK
        if: steps.rebase.outputs.needed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'vlc' }}
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          ./buildsystem/compile.sh --init
          GRADLE_ARGS=()
          if [ "$BUILD_TYPE" = signedRelease ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            GRADLE_ARGS=(-PkeyStoreFile="$KEYSTORE_PATH" -Pstorealias="$KEYSTORE_ALIAS")
          fi
          # build.gradle reads the key password from PASSWORD_KEYSTORE
          PASSWORD_KEYSTORE="$KEYSTORE_PASSWORD" ./gradlew "assemble${BUILD_TYPE^}" "${GRADLE_ARGS[@]}"

      - uses: actions/upload-artifact@v4
        if: steps.rebase.outputs.needed == 'true'
        with:
          name: vlc-android-${{ env.BUILD_TYPE }}-apk
          path: application/app/build/outputs/apk/**/*.apk
          retention-days: 180

      # Actions artifacts expire (90 days max on public repos), so keep the
      # long-term builds as GitHub Releases. The tag is pushed with git (the
      # rebased commit isn't on the remote yet), then the release is created
      # on that existing tag.
      - name: Publish release
        if: steps.rebase.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Without this gh resolves the repo from the `upstream` remote
          GH_REPO: ${{ github.repository }}
        run: |
          SHA=$(git rev-parse HEAD)
          TAG="build-$(date -u +%Y%m%d-%H%M)-${SHA:0:8}"
          mapfile -t APKS < <(find application/app/build/outputs/apk -name '*.apk')
          [ "${#APKS[@]}" -gt 0 ] || { echo "::error::No APK found"; exit 1; }
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "${APKS[@]}" \
            --verify-tag \
            --prerelease \
            --title "$CUSTOM_BRANCH $BUILD_TYPE build $(date -u +%Y-%m-%d)" \
            --notes "Rebased onto upstream/$UPSTREAM_BRANCH at $(git rev-parse --short "upstream/$UPSTREAM_BRANCH"). Source: $SHA"

      # The branch only moves once the build and the release succeeded, so a
      # failed run can simply be re-run. Pruning comes after it on purpose: a
      # prune failure turns the run red but can't hold the branch back.
      - name: Publish rebased branch
        if: steps.rebase.outputs.needed == 'true'
        env:
          OLD_SHA: ${{ steps.rebase.outputs.old_sha }}
        run: |
          NEW_SHA=$(git rev-parse HEAD)
          if [ "$NEW_SHA" != "$OLD_SHA" ]; then
            git push --force-with-lease="refs/heads/$CUSTOM_BRANCH:$OLD_SHA" origin "HEAD:refs/heads/$CUSTOM_BRANCH"
          fi
          {
            echo "### $CUSTOM_BRANCH rebased onto upstream/$UPSTREAM_BRANCH"
            echo "- before: \`$OLD_SHA\` (restorable via this SHA)"
            echo "- after: \`$NEW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep only the newest KEEP_BUILDS. Only releases tagged build-* are
      # ever touched.
      - name: Prune old releases
        if: steps.rebase.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_BUILDS: 3
        run: |
          set -o pipefail
          gh release list --limit 100 --json tagName,createdAt \
            | jq -r --argjson keep "$KEEP_BUILDS" \
                '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName' \
            | while read -r OLD; do
                echo "Pruning $OLD"
                gh release delete "$OLD" --cleanup-tag --yes
              done
